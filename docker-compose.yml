services:
  postgres:
    image: postgres:16 
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cli_app
    ports:
      - "5432:5432"
    volumes:
      - ./database/.config/postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: tuanphanle@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "8080:80" 
    depends_on:
      - postgres

volumes:
  postgres_data:
